      <rect x="0" y="24" width="760" height="192" rx="12" fill="#fffbea" stroke="#edd276" stroke-width="2"/>
      <text x="24" y="68" class="map purple">S → J1-2（第 2 行，第 20 列）</text>
      <text x="24" y="108" class="map orange">VCC → J1-29（第 1 行，第 6 列）/ 3.3 V</text>
      <text x="24" y="148" class="map dark">GND → J1-30（第 2 行，第 6 列）</text>
      <text x="24" y="188" class="small">项目约束：ir_rx = FPGA N4</text>
    </g>

