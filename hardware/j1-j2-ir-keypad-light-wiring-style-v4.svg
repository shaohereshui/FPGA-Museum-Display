    <text x="24" y="514" class="map">C2 → 第 2 行，第 10 列（J1-22）</text><text x="600" y="514" class="map">R3 → 第 2 行，第 4 列（J1-34）</text>
    <text x="24" y="552" class="map">C1 → 第 1 行，第 8 列（J1-25）</text><text x="600" y="552" class="map">R4 → 第 1 行，第 4 列（J1-33）</text>
